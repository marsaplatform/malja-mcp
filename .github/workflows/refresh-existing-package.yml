name: Refresh existing GHCR package

# Manual only: refresh the original personal-account package after repo transfer.
# Keep its existing public visibility and preserve every historical version tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-existing-ghcr-package
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ahmedvnabil/humanitarian-mcp

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing package visibility and publishing credentials
        env:
          GH_TOKEN: ${{ secrets.GHCR_COMPAT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set GHCR_COMPAT_TOKEN to the package owner's classic token with read:packages and write:packages."
            exit 1
          fi
          visibility=$(gh api users/ahmedvnabil/packages/container/humanitarian-mcp --jq .visibility)
          if [ "$visibility" != public ]; then
            echo "::error::Expected the existing public package; refusing to publish when its visibility is unknown or different."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate current source
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ahmedvnabil
          password: ${{ secrets.GHCR_COMPAT_TOKEN }}
      - name: Build and publish the existing package
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/marsaplatform/malja-mcp
            org.opencontainers.image.url=https://github.com/marsaplatform/malja-mcp
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Verify public installation and source metadata
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"
          docker pull --platform linux/amd64 "${IMAGE}:sha-${GITHUB_SHA}"
          source=$(docker inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
          test "$source" = "https://github.com/marsaplatform/malja-mcp"
