# Organisational self-hosting: `docker compose up -d`, then point any MCP
# client at http://<host>:8642/mcp (keep it behind your reverse proxy / VPN —
# the server is read-only but unauthenticated).
services:
  malja-mcp:
    image: ghcr.io/marsaplatform/malja-mcp:latest
    build: .
    restart: unless-stopped
    ports:
      - '8642:8642'
    volumes:
      - malja-cache:/data
    environment:
      MALJA_PROVIDERS: unhcr,worldbank
      # Enable HDX (conflict, food security, funding, IDPs) with a free
      # app identifier — see .env.example:
      # MALJA_PROVIDERS: unhcr,worldbank,hdx
      # MALJA_HDX_APP_ID: ${MALJA_HDX_APP_ID}
      MALJA_LOG_LEVEL: info

volumes:
  malja-cache:
